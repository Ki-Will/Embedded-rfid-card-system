<!DOCTYPE html>
<html>
<head>
    <title>RFID Top-Up Dashboard</title>
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            min-height: 100vh;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
            color: #e0e0e0;
        }

        .container {
            background: linear-gradient(135deg, #2c2c54 0%, #40407a 100%);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            padding: 30px;
            max-width: 450px;
            width: 100%;
            max-height: 95vh;
            overflow-y: auto;
            border: 1px solid #5f27cd;
        }

        .header h1 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .header .team {
            color: #a29bfe;
            font-size: 14px;
            font-weight: bold;
        }

        .content {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .topup-section {
            width: 300px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 2px solid #ffffff;
            margin: 0 10px;
        }

        .card-info {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: #2d3436;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 2px solid #ffffff;
            position: relative;
            overflow: hidden;
        }

        .card-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="80" r="2" fill="rgba(255,255,255,0.1)"/></svg>') no-repeat;
            background-size: 50px 50px;
            opacity: 0.1;
        }

        .card-chip {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
        }

        .card-number {
            position: absolute;
            bottom: 40px;
            left: 20px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .card-balance {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 16px;
            font-weight: 600;
        }

        .card-detail {
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .card-detail label {
            display: block;
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .card-detail .value {
            font-size: 22px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .card-detail .value.waiting {
            opacity: 0.7;
            font-style: italic;
            font-size: 18px;
        }

        .topup-section h3 {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            color: #e0e0e0;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input {
            width: 90%;
            padding: 12px 15px;
            border: 2px solid #ffffff;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .input-group input::placeholder {
            color: #f0f0f0;
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            .card-info, .topup-section {
                width: 100%;
                max-width: 400px;
                margin: 10px 0;
            }
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .quick-amount-btn {
            padding: 10px;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .quick-amount-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        .topup-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .topup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 184, 148, 0.4);
        }

        .topup-btn:active {
            transform: translateY(0);
        }

        .topup-btn:disabled {
            background: #636e72;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #55efc4;
            color: #00b894;
            border: 1px solid #00b894;
        }

        .message.error {
            background: #fab1a0;
            color: #e17055;
            border: 1px solid #e17055;
        }

        .message.info {
            background: #74b9ff;
            color: #0984e3;
            border: 1px solid #0984e3;
        }

        .message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #a29bfe;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1>Smart RFID Card Management</h1>
        </div>
        <div class="header">
            <h1>RFID Card Top-Up Dashboard</h1>
        </div>
        <div id="status" class="message info" style="display: none;">Waiting for card...</div>
        <div class="content">
            <div id="card-info" class="card-info" style="display: none;">
                <div class="card-chip">💳</div>
                <div class="card-number" id="card-uid">XXXX XXXX XXXX XXXX</div>
                <div class="card-balance" id="balance-display">RWF 0</div>
            </div>
            <div class="topup-section">
                <h2>Top-Up Amount</h2>
                <div class="input-group">
                    <label for="amount">Top-Up Amount (RWF):</label>
                    <input type="number" id="amount" min="0">
                </div>
                <button id="topup-btn" class="topup-btn" onclick="topup()" disabled>Top Up</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.socket.io/3.1.3/socket.io.min.js"></script>
    <script>
        const backendUrl = 'http://157.173.101.159:8228'; // adjust for actual host
        const socket = io(backendUrl);
        const statusEl = document.getElementById('status');
        const cardInfoEl = document.getElementById('card-info');
        const uidDisplay = document.getElementById('uid-display');
        const balanceDisplay = document.getElementById('balance-display');
        const amountInput = document.getElementById('amount');
        const topupBtn = document.getElementById('topup-btn');

        let currentUid = null;

        socket.on('card_status', (data) => {
            currentUid = data.uid;
            uidDisplay.textContent = data.uid;
            balanceDisplay.textContent = data.balance;
            cardInfoEl.style.display = 'block';
            statusEl.textContent = 'Card detected. Enter amount and top up.';
            statusEl.classList.remove('info');
            statusEl.classList.add('success');
            statusEl.style.display = 'block';
            topupBtn.disabled = false;
        });

        socket.on('balance_update', (data) => {
            if (data.uid === currentUid) {
                balanceDisplay.textContent = data.new_balance;
                statusEl.textContent = 'Top-up successful! New balance updated.';
                statusEl.classList.remove('info');
                statusEl.classList.add('success');
                statusEl.style.display = 'block';
            }
        });

        function topup() {
            const amount = parseInt(amountInput.value);
            if (!currentUid || !amount || amount <= 0) {
                alert('Please ensure card is detected and amount is valid.');
                return;
            }
            statusEl.textContent = 'Processing top-up...';
            statusEl.classList.remove('success', 'error');
            statusEl.classList.add('info');
            statusEl.style.display = 'block';
            topupBtn.disabled = true;
            console.log('Sending topup request:', { uid: currentUid, amount });
            fetch(`${backendUrl}/topup`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({uid: currentUid, amount})
            }).then(res => {
                console.log('Fetch response status:', res.status);
                return res.json();
            }).then(data => {
                console.log('Response data:', data);
                if (data.status === 'topup requested') {
                    statusEl.textContent = 'Top-up requested. Waiting for confirmation...';
                    statusEl.classList.remove('success', 'error');
                    statusEl.classList.add('info');
                    statusEl.style.display = 'block';
                } else {
                    statusEl.textContent = 'Error: ' + data.status;
                    statusEl.classList.remove('success', 'info');
                    statusEl.classList.add('error');
                    statusEl.style.display = 'block';
                    topupBtn.disabled = false;
                }
            }).catch(err => {
                console.log('Fetch error:', err);
                statusEl.textContent = 'Error: ' + err.message;
                statusEl.classList.remove('success', 'info');
                statusEl.classList.add('error');
                statusEl.style.display = 'block';
                topupBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
